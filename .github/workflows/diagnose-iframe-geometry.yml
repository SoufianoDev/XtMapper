name: Temporary iframe geometry diagnostic

on:
  push:
    branches:
      - "ui/main-activity-premium-redesign"
    paths:
      - ".github/workflows/diagnose-iframe-geometry.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start prototype server
        run: |
          python3 -m http.server 4173 --directory prototypes >/tmp/prototype-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/prototype-server.log
          exit 1
      - name: Measure frame and iframe geometry
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true, args: ['--no-sandbox'] });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
            await page.locator('#devicePreset').selectOption('samsung-s22-plus');
            await page.waitForFunction(() => {
              const image = document.querySelector('.device-mockup__frame');
              return image?.complete && image.naturalWidth > 0 &&
                document.querySelector('#previewCaption')?.textContent.includes('Samsung Galaxy S22+');
            }, { timeout: 60000 });
            await page.waitForTimeout(200);
            const measured = await page.evaluate(() => {
              const q = selector => {
                const el = document.querySelector(selector);
                const r = el.getBoundingClientRect();
                const cs = getComputedStyle(el);
                return {
                  rect: { x:r.x, y:r.y, width:r.width, height:r.height },
                  css: { width:cs.width, height:cs.height, transform:cs.transform },
                  client: { width:el.clientWidth, height:el.clientHeight }
                };
              };
              const frame = document.querySelector('#deviceFrame');
              return {
                scale: frame.style.getPropertyValue('--device-scale'),
                frame: q('#deviceFrame'),
                mockup: q('.device-mockup'),
                screen: q('.device-mockup__screen'),
                viewportLayer: q('.device-mockup__viewport'),
                iframe: {
                  ...q('#activityFrame'),
                  innerViewport: {
                    width: document.querySelector('#activityFrame').contentWindow.innerWidth,
                    height: document.querySelector('#activityFrame').contentWindow.innerHeight
                  }
                },
                image: q('.device-mockup__frame')
              };
            });
            console.log('IFRAME_GEOMETRY_DIAGNOSTIC');
            console.log(JSON.stringify(measured, null, 2));
          } finally {
            await browser.close();
          }
          NODE
