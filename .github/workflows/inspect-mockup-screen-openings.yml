name: Inspect external mockup screen openings

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect supplied WebP mockups
        run: |
          python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
          python - <<'PY'
          import io
          import json
          import urllib.request
          import numpy as np
          import cv2
          from PIL import Image

          ASSETS = {
              "samsung-galaxy-s26-ultra": "https://www.webmobilefirst.com/img/mockups/mockup-samsung-galaxy-s26-ultra-2026-transparent.webp",
              "samsung-galaxy-a17": "https://www.webmobilefirst.com/img/mockups/mockup-samsung-galaxy-a17-2025-transparent.webp",
              "samsung-galaxy-s24": "https://www.webmobilefirst.com/img/mockups/mockup-samsung-galaxy-s24-2024-transparent.webp",
              "samsung-galaxy-s24-ultra": "https://www.webmobilefirst.com/img/mockups/mockup-samsung-galaxy-s24-ultra-2024-transparent.webp",
              "samsung-galaxy-s22": "https://www.webmobilefirst.com/img/mockups/mockup-samsung-galaxy-s22-2022-transparent.webp",
              "samsung-galaxy-s22-ultra": "https://www.webmobilefirst.com/img/mockups/mockup-samsung-galaxy-s22-ultra-2022-transparent.webp",
              "samsung-galaxy-s22-plus": "https://www.webmobilefirst.com/img/mockups/mockup-samsung-galaxy-s22-plus-2022-transparent.webp",
              "samsung-galaxy-a12": "https://www.webmobilefirst.com/img/mockups/mockup-samsung-galaxy-a12-2021-transparent.webp",
              "samsung-galaxy-s21-ultra": "https://www.webmobilefirst.com/img/mockups/mockup-samsung-galaxy-s21-ultra-transparent.webp",
              "samsung-galaxy-z-flip3": "https://www.webmobilefirst.com/img/mockups/mockup-samsung-galaxy-z-flip3-2021-transparent.webp",
              "samsung-galaxy-note20-ultra": "https://www.webmobilefirst.com/img/mockups/mockup-samsung-galaxy-note20-ultra-transparent.webp",
              "samsung-galaxy-s20": "https://www.webmobilefirst.com/img/mockups/mockup-samsung-galaxy-s20-transparent.webp",
              "samsung-galaxy-fold2": "https://www.webmobilefirst.com/img/mockups/mockup-samsung-galaxy-fold2-transparent.webp",
              "samsung-galaxy-fold": "https://www.webmobilefirst.com/img/mockups/mockup-samsung-galaxy-fold-transparent.webp",
              "google-pixel-10": "https://www.webmobilefirst.com/img/mockups/mockup-google-pixel-10-2026-transparent.webp",
              "google-pixel-10-pro": "https://www.webmobilefirst.com/img/mockups/mockup-google-pixel-10-pro-2026-transparent.webp",
              "google-pixel-10-pro-fold": "https://www.webmobilefirst.com/img/mockups/mockup-google-pixel-10-pro-fold-2026-transparent.webp",
              "google-pixel-8": "https://www.webmobilefirst.com/img/mockups/mockup-google-pixel-8-2024-transparent.webp",
              "google-pixel-6-pro": "https://www.webmobilefirst.com/img/mockups/mockup-google-pixel-6-pro-transparent.webp",
              "google-pixel-5": "https://www.webmobilefirst.com/img/mockups/mockup-google-pixel-5-transparent.webp",
              "xiaomi-12": "https://www.webmobilefirst.com/img/mockups/mockup-xiaomi-12-2022-transparent.webp",
              "xiaomi-mi-11i": "https://www.webmobilefirst.com/img/mockups/mockup-xiaomi-mi-11i-transparent.webp",
              "infinix-hot-70": "https://www.webmobilefirst.com/img/mockups/mockup-infinix-hot-70-2026-transparent.webp",
              "motorola-razr-70-ultra": "https://www.webmobilefirst.com/img/mockups/mockup-motorola-razr-70-ultra-2026-transparent.webp",
              "oneplus-nord-2": "https://www.webmobilefirst.com/img/mockups/mockup-oneplus-nord-2-transparent.webp",
              "oppo-find-x3-pro": "https://www.webmobilefirst.com/img/mockups/mockup-oppo-find-x3-pro-transparent.webp",
              "huawei-p30-pro": "https://www.webmobilefirst.com/img/mockups/mockup-huawei-p30-pro-transparent.webp",
              "generic-android": "https://www.webmobilefirst.com/img/mockups/mockup-non-branded-android-smartphone-transparent.webp",
              "galaxy-tab-s7": "https://www.webmobilefirst.com/img/mockups/mockup-samsung-galaxy-tab-s7-transparent.webp",
          }

          output = {}
          for name, url in ASSETS.items():
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "XtMapper-Mockup-Inspector/1.0"})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read()
                      content_type = response.headers.get("Content-Type")
                  image = Image.open(io.BytesIO(raw)).convert("RGBA")
                  rgba = np.asarray(image)
                  alpha = rgba[:, :, 3]
                  transparent = (alpha < 128).astype(np.uint8)
                  count, labels, stats, centroids = cv2.connectedComponentsWithStats(transparent, connectivity=8)
                  candidates = []
                  for i in range(1, count):
                      x, y, w, h, area = [int(v) for v in stats[i]]
                      touches_edge = x == 0 or y == 0 or x + w >= image.width or y + h >= image.height
                      if not touches_edge and area > 500:
                          candidates.append({"x": x, "y": y, "width": w, "height": h, "area": area})
                  candidates.sort(key=lambda item: item["area"], reverse=True)
                  output[name] = {
                      "url": url,
                      "httpContentType": content_type,
                      "bytes": len(raw),
                      "imageWidth": image.width,
                      "imageHeight": image.height,
                      "alphaMin": int(alpha.min()),
                      "alphaMax": int(alpha.max()),
                      "transparentRatio": round(float(np.mean(alpha < 128)), 5),
                      "internalTransparentComponents": candidates[:8],
                  }
              except Exception as exc:
                  output[name] = {"url": url, "error": repr(exc)}

          print("MOCKUP_INSPECTION_JSON_BEGIN")
          print(json.dumps(output, indent=2))
          print("MOCKUP_INSPECTION_JSON_END")
          PY
