name: Publish connection lifecycle test APK

on:
  push:
    branches:
      - test/connection-lifecycle-20261028
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connection-lifecycle-test-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish direct APK download
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK and NDK
        uses: premex-ab/setup-android-cli@35c853708c8a6981651bb0060a17e01fac0143b1
        with:
          packages: |
            platforms/android-37
            build-tools/37.0.0
            ndk/28.0.13004108
            platform-tools
          no-metrics: 'true'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests and build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Publish APK as a GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
        run: |
          test -f "$APK_PATH"
          short_sha="${GITHUB_SHA:0:7}"
          tag="test-connection-lifecycle-$short_sha"
          gh release create "$tag" "$APK_PATH#app-debug.apk" \
            --title "XtMapper connection lifecycle test ($short_sha)" \
            --notes "Unofficial test build from branch test/connection-lifecycle-20261028. Automated unit tests and build passed for this commit, but this build has not been confirmed to fix issue #228. Please use it only for testing." \
            --prerelease \
            --target "$GITHUB_SHA"
          echo "Direct APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/app-debug.apk"
