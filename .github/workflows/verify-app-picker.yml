name: Verify App Picker Prototype

on:
  push:
    branches:
      - "ui/main-activity-premium-redesign"
    paths:
      - "prototypes/**"
      - ".github/workflows/verify-app-picker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-picker-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: App Picker discovery and registry
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start prototype server
        run: |
          python3 -m http.server 4173 --directory prototypes >/tmp/prototype-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/prototype-server.log
          exit 1

      - name: Verify App Picker behavior
        run: node prototypes/tests/app-picker.spec.mjs
