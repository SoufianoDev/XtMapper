name: Temporary extension scale comparison

on:
  push:
    branches:
      - "ui/main-activity-premium-redesign"
    paths:
      - "prototypes/**"
      - ".github/workflows/verify-extension-scale.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start prototype server
        run: |
          python3 -m http.server 4173 --directory prototypes >/tmp/prototype-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/prototype-server.log
          exit 1
      - name: Compare Galaxy S22+ against extension reference
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true, args: ['--no-sandbox'] });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            page.on('pageerror', error => { throw error; });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
            await page.locator('#devicePreset').selectOption('samsung-s22-plus');
            await page.waitForFunction(() => {
              const image = document.querySelector('.device-mockup__frame');
              return image?.complete && image.naturalWidth > 0 &&
                document.querySelector('#previewCaption')?.textContent.includes('Samsung Galaxy S22+');
            }, { timeout: 60000 });
            const portrait = await page.evaluate(() => {
              const frame = document.querySelector('#deviceFrame');
              const rect = frame.getBoundingClientRect();
              const stage = document.querySelector('#previewStage').getBoundingClientRect();
              const preview = document.querySelector('.preview').getBoundingClientRect();
              return {
                scale: Number(frame.style.getPropertyValue('--device-scale')),
                baseWidth: Number.parseFloat(frame.style.width),
                baseHeight: Number.parseFloat(frame.style.height),
                renderedWidth: rect.width,
                renderedHeight: rect.height,
                stageOffset: stage.left - (preview.left + (preview.width - stage.width) / 2)
              };
            });
            if (Math.abs(portrait.scale - 0.81) > 0.001) throw new Error('Portrait scale mismatch: ' + JSON.stringify(portrait));
            if (Math.abs(portrait.stageOffset - 24) > 1) throw new Error('Right offset mismatch: ' + JSON.stringify(portrait));

            await page.locator('#rotateDevice').click();
            await page.waitForFunction(() => document.querySelector('#previewCaption')?.textContent.includes('landscape'));
            const landscape = await page.evaluate(() => ({
              scale: Number(document.querySelector('#deviceFrame').style.getPropertyValue('--device-scale')),
              transform: getComputedStyle(document.querySelector('#previewStage')).transform
            }));
            if (landscape.scale > 1.001 || landscape.transform !== 'none') {
              throw new Error('Landscape changed: ' + JSON.stringify(landscape));
            }
            console.log('EXTENSION_SCALE_COMPARISON_PASSED');
            console.log(JSON.stringify({
              extensionReference: { baseWidth: 393, baseHeight: 811, scale: 0.81, renderedWidth: 318.33, renderedHeight: 656.91 },
              prototypePortrait: portrait,
              prototypeLandscape: landscape
            }, null, 2));
          } finally {
            await browser.close();
          }
          NODE
