name: Temporary portrait scale verification

on:
  push:
    branches:
      - "ui/main-activity-premium-redesign"
    paths:
      - "prototypes/**"
      - ".github/workflows/verify-portrait-scale.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start prototype server
        run: |
          python3 -m http.server 4173 --directory prototypes >/tmp/prototype-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/prototype-server.log
          exit 1
      - name: Verify portrait scale and rightward offset
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true, args: ['--no-sandbox'] });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            page.on('pageerror', error => { throw error; });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => {
              const image = document.querySelector('.device-mockup__frame');
              return image?.complete && image.naturalWidth > 0 &&
                document.querySelector('#previewCaption')?.textContent.includes('portrait');
            }, { timeout: 60000 });
            const portrait = await page.evaluate(() => {
              const stage = document.querySelector('#previewStage').getBoundingClientRect();
              const preview = document.querySelector('.preview').getBoundingClientRect();
              const frame = document.querySelector('#deviceFrame');
              return {
                scale: Number(frame.style.getPropertyValue('--device-scale')),
                frameWidth: frame.getBoundingClientRect().width,
                frameHeight: frame.getBoundingClientRect().height,
                stageWidth: stage.width,
                previewWidth: preview.width,
                stageOffset: stage.left - (preview.left + (preview.width - stage.width) / 2),
                panelLeft: document.querySelector('.panel').getBoundingClientRect().left,
                previewRight: preview.right,
                panelPosition: getComputedStyle(document.querySelector('.panel')).position
              };
            });
            if (Math.abs(portrait.scale - 1.25) > 0.001) throw new Error('Portrait scale mismatch: ' + JSON.stringify(portrait));
            if (Math.abs(portrait.stageOffset - 24) > 1) throw new Error('Portrait offset mismatch: ' + JSON.stringify(portrait));
            if (portrait.panelLeft <= portrait.previewRight) throw new Error('Settings panel not on the right: ' + JSON.stringify(portrait));

            await page.locator('#rotateDevice').click();
            await page.waitForFunction(() => document.querySelector('#previewCaption')?.textContent.includes('landscape'));
            const landscape = await page.evaluate(() => ({
              scale: Number(document.querySelector('#deviceFrame').style.getPropertyValue('--device-scale')),
              stageTransform: getComputedStyle(document.querySelector('#previewStage')).transform,
              panelLeft: document.querySelector('.panel').getBoundingClientRect().left,
              previewRight: document.querySelector('.preview').getBoundingClientRect().right
            }));
            if (landscape.scale > 1.001) throw new Error('Landscape scale changed: ' + JSON.stringify(landscape));
            if (landscape.stageTransform !== 'none') throw new Error('Landscape unexpectedly shifted: ' + JSON.stringify(landscape));
            if (landscape.panelLeft <= landscape.previewRight) throw new Error('Landscape panel not on the right: ' + JSON.stringify(landscape));
            console.log('PORTRAIT_SCALE_AND_OFFSET_VERIFICATION_PASSED');
            console.log(JSON.stringify({portrait, landscape}, null, 2));
          } finally {
            await browser.close();
          }
          NODE
