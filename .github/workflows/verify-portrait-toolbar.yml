name: Temporary portrait toolbar layout check

on:
  push:
    branches:
      - "ui/main-activity-premium-redesign"
    paths:
      - ".github/workflows/verify-portrait-toolbar.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start prototype server
        run: |
          python3 -m http.server 4173 --directory prototypes >/tmp/prototype-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/prototype-server.log
          exit 1
      - name: Verify portrait toolbar, tablet, landscape, and settings panel
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true, args: ['--no-sandbox'] });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            page.on('pageerror', error => { throw error; });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });

            const waitForRenderedDevice = async () => {
              await page.waitForFunction(() => {
                const image = document.querySelector('.device-mockup__frame');
                const frame = document.querySelector('#deviceFrame');
                return image?.complete && image.naturalWidth > 0 &&
                  frame?.style.getPropertyValue('--device-scale') !== '';
              }, { timeout: 60000 });
            };
            const selectDevice = async id => {
              await page.locator('#devicePreset').selectOption(id);
              await page.waitForFunction(id =>
                document.querySelector('#devicePreset')?.value === id &&
                document.querySelector('#previewCaption')?.textContent.length > 0,
                id
              );
              await waitForRenderedDevice();
            };

            await selectDevice('google-pixel-10-pro');
            const phone = await page.evaluate(() => {
              const preview = document.querySelector('.preview');
              const toolbar = document.querySelector('.preview-toolbar');
              const stage = document.querySelector('#previewStage');
              const frame = document.querySelector('#deviceFrame');
              const panel = document.querySelector('.panel');
              const p = preview.getBoundingClientRect();
              const t = toolbar.getBoundingClientRect();
              const s = stage.getBoundingClientRect();
              const f = frame.getBoundingClientRect();
              const panelRect = panel.getBoundingClientRect();
              return {
                previewWidth: p.width,
                toolbar: { left:t.left, right:t.right, top:t.top, bottom:t.bottom, position:getComputedStyle(toolbar).position },
                stage: { left:s.left, top:s.top, width:s.width, height:s.height },
                frame: { left:f.left, top:f.top, width:f.width, height:f.height, scale:frame.style.getPropertyValue('--device-scale') },
                gapToolbarToFrame: f.left - t.right,
                stageTopOffset: s.top - p.top,
                panelToPreviewGap: panelRect.left - p.right,
                portraitPhoneClass: preview.classList.contains('preview--portrait-phone')
              };
            });
            if (!phone.portraitPhoneClass) throw new Error('Phone portrait class missing: ' + JSON.stringify(phone));
            if (phone.toolbar.position !== 'absolute') throw new Error('Toolbar is not floated out of portrait flow: ' + JSON.stringify(phone));
            if (phone.stageTopOffset > 2) throw new Error('Phone stage did not move to the top of preview area: ' + JSON.stringify(phone));
            if (phone.gapToolbarToFrame < 8) throw new Error('Toolbar overlaps phone frame or leaves insufficient separation: ' + JSON.stringify(phone));
            if (phone.panelToPreviewGap < 0) throw new Error('Settings panel no longer sits to the right of preview: ' + JSON.stringify(phone));

            await selectDevice('galaxy-tab-s7');
            const tablet = await page.evaluate(() => ({
              classPresent:document.querySelector('.preview').classList.contains('preview--portrait-phone'),
              toolbarPosition:getComputedStyle(document.querySelector('.preview-toolbar')).position,
              toolbarBottom:document.querySelector('.preview-toolbar').getBoundingClientRect().bottom,
              stageTop:document.querySelector('#previewStage').getBoundingClientRect().top
            }));
            if (tablet.classPresent || tablet.toolbarPosition === 'absolute' || tablet.stageTop <= tablet.toolbarBottom) {
              throw new Error('Tablet portrait layout changed unexpectedly: ' + JSON.stringify(tablet));
            }

            await page.locator('#rotateDevice').click();
            await page.waitForFunction(() => document.querySelector('#previewCaption')?.textContent.includes('landscape'));
            await waitForRenderedDevice();
            const landscape = await page.evaluate(() => ({
              classPresent:document.querySelector('.preview').classList.contains('preview--portrait-phone'),
              toolbarPosition:getComputedStyle(document.querySelector('.preview-toolbar')).position
            }));
            if (landscape.classPresent || landscape.toolbarPosition === 'absolute') {
              throw new Error('Landscape toolbar layout changed unexpectedly: ' + JSON.stringify(landscape));
            }

            console.log('PORTRAIT_TOOLBAR_LAYOUT_PASSED');
            console.log(JSON.stringify({phone,tablet,landscape},null,2));
          } finally {
            await browser.close();
          }
          NODE
