name: Verify device preview centering

on:
  push:
    branches:
      - "ui/main-activity-premium-redesign"
    paths:
      - ".github/workflows/verify-preview-centering.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify centering and landscape enlargement
        run: |
          python3 -m http.server 4173 --directory prototypes >/tmp/xtmapper-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import { chromium } from "playwright";
          import { devices } from "./prototypes/devices/index.mjs";

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const failures = [];
          try {
            await page.goto("http://127.0.0.1:4173/", { waitUntil: "domcontentloaded" });
            await page.waitForFunction(() => document.querySelectorAll("#devicePreset option").length > 1);

            for (const device of devices) {
              await page.locator("#devicePreset").selectOption(device.id);
              await page.waitForFunction(() => {
                const image = document.querySelector(".device-mockup__frame");
                return image && image.complete && image.naturalWidth > 0;
              }, null, { timeout: 20000 });

              for (const orientation of ["portrait", "landscape"]) {
                if (orientation === "landscape") await page.locator("#rotateDevice").click();

                const expected = orientation === "portrait"
                  ? [device.viewport.width, device.viewport.height]
                  : [device.viewport.height, device.viewport.width];

                await page.waitForFunction(({ width, height, orientation }) => {
                  const iframe = document.querySelector("#activityFrame");
                  const caption = document.querySelector("#previewCaption")?.textContent || "";
                  return Number(iframe?.width) === width &&
                    Number(iframe?.height) === height &&
                    caption.includes(" · " + orientation + " · ");
                }, { width: expected[0], height: expected[1], orientation }, { timeout: 20000 });

                const measured = await page.evaluate(() => {
                  const rect = element => {
                    const r = element.getBoundingClientRect();
                    return { left:r.left, top:r.top, right:r.right, bottom:r.bottom, width:r.width, height:r.height };
                  };
                  const frame = document.querySelector("#deviceFrame");
                  const preview = document.querySelector(".preview");
                  const stage = document.querySelector("#previewStage");
                  const toolbar = document.querySelector(".preview-toolbar");
                  const caption = document.querySelector("#previewCaption");
                  return {
                    preview: rect(preview),
                    stage: rect(stage),
                    frame: rect(frame),
                    toolbar: rect(toolbar),
                    caption: rect(caption),
                    scale: Number(getComputedStyle(frame).getPropertyValue("--device-scale")),
                    landscapeLayout: document.querySelector(".showcase").classList.contains("showcase--landscape-preview"),
                    iframeSize: [Number(document.querySelector("#activityFrame").width), Number(document.querySelector("#activityFrame").height)]
                  };
                });

                const centerDelta = Math.abs(
                  (measured.stage.left + measured.stage.width / 2) -
                  (measured.preview.left + measured.preview.width / 2)
                );
                const separation = measured.stage.top - measured.toolbar.bottom;
                const stageFrameDelta = Math.max(
                  Math.abs(measured.stage.left - measured.frame.left),
                  Math.abs(measured.stage.top - measured.frame.top),
                  Math.abs(measured.stage.width - measured.frame.width),
                  Math.abs(measured.stage.height - measured.frame.height)
                );
                const centered = centerDelta <= 2.5;
                const separated = separation >= 8;
                const frameMatchesStage = stageFrameDelta <= 2.5;
                const landscapeExpanded = orientation !== "landscape" ||
                  measured.landscapeLayout && measured.preview.width >= 850;
                const phoneEnlarged = orientation !== "landscape" ||
                  device.type !== "phone" || device.id.includes("fold") ||
                  measured.scale >= 1.02;

                if (!centered || !separated || !frameMatchesStage || !landscapeExpanded || !phoneEnlarged) {
                  failures.push({ device:device.id,orientation,centerDelta,separation,stageFrameDelta,scale:measured.scale,measured });
                }
                console.log(JSON.stringify({
                  device:device.id,
                  orientation,
                  centerDelta,
                  separation,
                  scale:measured.scale,
                  centered,
                  separated,
                  landscapeExpanded,
                  phoneEnlarged
                }));

                if (orientation === "landscape") await page.locator("#rotateDevice").click();
              }
            }

            if (failures.length) {
              console.error("PREVIEW_LAYOUT_FAILURES", JSON.stringify(failures, null, 2));
              process.exitCode = 1;
            } else {
              console.log("PREVIEW_LAYOUT_VERIFICATION_PASSED", devices.length, "devices x 2 orientations");
            }
          } finally {
            await browser.close();
          }
          JS
