                'Only the main Activity scroller should retain its visible scrollbar: ' +
                JSON.stringify(activityScrollbars)
              );
            }

            const hiddenActivityScrollbar = await frame.locator('#app').evaluate(app => {
              const probe = document.createElement('div');
              probe.style.cssText = 'width:40px;height:32px;overflow:auto;position:absolute;left:-10000px;';
              probe.innerHTML = '<div style="height:120px;width:80px"></div>';
              app.append(probe);
              const result = {
                width: getComputedStyle(probe).scrollbarWidth,
                webkitDisplay: getComputedStyle(probe, '::-webkit-scrollbar').display
