name: Prototype Preview State Verification

on:
  push:
    branches:
      - "ui/main-activity-premium-redesign"
      - "feat/touch-preview-scrollbar"
    paths:
      - "prototypes/**"
      - ".github/workflows/verify-preview-state.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-preview-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify device selection and rotation persistence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start prototype server
        run: |
          python3 -m http.server 4173 --directory prototypes >/tmp/prototype-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/prototype-server.log
          exit 1

      - name: Verify device and orientation persistence
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const STORAGE_KEY = 'xtmapper.device-preview.state.v1';
          const browser = await chromium.launch({
            headless: true,
            args: ['--no-sandbox']
          });
          const context = await browser.newContext({
            viewport: { width: 1440, height: 900 }
          });

          try {
            let page = await context.newPage();
            page.on('pageerror', error => {
              throw error;
            });

            await page.goto('http://127.0.0.1:4173/', {
              waitUntil: 'domcontentloaded'
            });

            const waitForRenderedFrame = async () => {
              await page.waitForFunction(() => {
                const frame = document.querySelector('#deviceFrame');
                if (!frame) return false;

                // Device mockups use a remote image asset.
                const image = frame.querySelector('.device-mockup__frame');
                const mockupReady = !!image && image.complete && image.naturalWidth > 0;

                // Custom viewports use the built-in CSS frame instead.
                const cssFrame = frame.classList.contains('device-frame--css')
                  ? frame.querySelector('.device-screen iframe')
                  : null;
                const cssFrameReady = !!cssFrame &&
                  Number(cssFrame.getAttribute('width')) > 0 &&
                  Number(cssFrame.getAttribute('height')) > 0 &&
                  Number.parseFloat(frame.style.width) > 0 &&
                  Number.parseFloat(frame.style.height) > 0;

                return mockupReady || cssFrameReady;
              }, null, { timeout: 60000 });
            };

            const waitForDevice = async (id, captionText, orientation) => {
              await page.waitForFunction(
                ({ id, captionText, orientation }) => {
                  const select = document.querySelector('#devicePreset');
                  const caption = document.querySelector('#previewCaption')?.textContent || '';
                  return select?.value === id &&
                    caption.includes(captionText) &&
                    caption.includes(orientation);
                },
                { id, captionText, orientation },
                { timeout: 60000 }
              );
              await waitForRenderedFrame();
            };

            await waitForDevice(
              'google-pixel-10-pro',
              'Google Pixel 10 Pro',
              'portrait'
            );

            const initialState = await page.evaluate(key => ({
              selected: document.querySelector('#devicePreset').value,
              caption: document.querySelector('#previewCaption').textContent,
              saved: localStorage.getItem(key)
            }), STORAGE_KEY);
            
            await page.waitForFunction(() => {
              const frame = document.querySelector('#activityFrame');
              return frame?.contentDocument?.readyState === 'complete' &&
                !!frame.contentDocument.querySelector('#addGameButton');
            }, null, { timeout: 60000 });

            const initialLibraryState = await page.evaluate(() => {
              const document = window.document.querySelector('#activityFrame')?.contentDocument;
              const state = JSON.parse(
                document?.defaultView.localStorage.getItem('xtmapper-main-prototype-v10') || 'null'
              );
              return {
                scenario: state?.libraryScenario,
                selectedId: state?.selectedId,
                addGamesHidden: document?.querySelector('#addGameButton')?.hidden,
                firstGameVisible: !!document?.querySelector('#emptyAddGameButton') &&
                  getComputedStyle(document.querySelector('#emptyAddGameButton')).display !== 'none',
                importVisible: !!document?.querySelector('#emptyImportButton') &&
                  getComputedStyle(document.querySelector('#emptyImportButton')).display !== 'none'
              };
            });

            if (initialLibraryState.scenario !== 'empty' ||
                initialLibraryState.addGamesHidden !== true ||
                !initialLibraryState.firstGameVisible ||
                !initialLibraryState.importVisible) {
              throw new Error(
                'A fresh prototype visit must start with an empty library and only the inline first-game actions: ' +
                JSON.stringify(initialLibraryState)
              );
            }

            if (initialState.selected !== 'google-pixel-10-pro' ||
                initialState.saved !== null) {
              throw new Error(
                'Fresh browser did not start with the default state: ' +
                JSON.stringify(initialState)
              );
            }

            // Rotate, then change devices. The new device must keep landscape.
            await page.locator('#rotateDevice').click();
            await waitForDevice(
              'google-pixel-10-pro',
              'Google Pixel 10 Pro',
              'landscape'
            );

            await page.locator('#devicePreset').selectOption('samsung-s24');
            await waitForDevice('samsung-s24', 'Samsung Galaxy S24', 'landscape');

            const switchedWhileLandscape = await page.evaluate(key => ({
              selected: document.querySelector('#devicePreset').value,
              caption: document.querySelector('#previewCaption').textContent,
              state: JSON.parse(localStorage.getItem(key))
            }), STORAGE_KEY);

            if (switchedWhileLandscape.state?.deviceId !== 'samsung-s24' ||
                switchedWhileLandscape.state?.orientation !== 'landscape') {
              throw new Error(
                'Changing device did not preserve landscape: ' +
                JSON.stringify(switchedWhileLandscape)
              );
            }

            if (!switchedWhileLandscape.caption.includes('780 × 360 CSS px')) {
              throw new Error(
                'The selected phone did not use landscape viewport dimensions: ' +
                JSON.stringify(switchedWhileLandscape)
              );
            }

            // A reload and a newly opened page must restore the same state.
            await page.reload({ waitUntil: 'domcontentloaded' });
            await waitForDevice('samsung-s24', 'Samsung Galaxy S24', 'landscape');

            await page.close();
            page = await context.newPage();
            page.on('pageerror', error => {
              throw error;
            });
            await page.goto('http://127.0.0.1:4173/', {
              waitUntil: 'domcontentloaded'
            });
            await waitForDevice('samsung-s24', 'Samsung Galaxy S24', 'landscape');

            // Switching in portrait must also preserve portrait.
            await page.locator('#rotateDevice').click();
            await waitForDevice('samsung-s24', 'Samsung Galaxy S24', 'portrait');

            await page.locator('#devicePreset').selectOption('galaxy-tab-s7');
            await waitForDevice(
              'galaxy-tab-s7',
              'Samsung Galaxy Tab S7',
              'portrait'
            );

            const switchedWhilePortrait = await page.evaluate(
              key => JSON.parse(localStorage.getItem(key)),
              STORAGE_KEY
            );

            if (switchedWhilePortrait?.deviceId !== 'galaxy-tab-s7' ||
                switchedWhilePortrait?.orientation !== 'portrait') {
              throw new Error(
                'Changing device did not preserve portrait: ' +
                JSON.stringify(switchedWhilePortrait)
              );
            }

            // Tablet selection and rotation must survive a reload.
            await page.locator('#rotateDevice').click();
            await waitForDevice(
              'galaxy-tab-s7',
              'Samsung Galaxy Tab S7',
              'landscape'
            );
            await page.reload({ waitUntil: 'domcontentloaded' });
            await waitForDevice(
              'galaxy-tab-s7',
              'Samsung Galaxy Tab S7',
              'landscape'
            );

            // Custom viewport uses CSS, not a remote mockup image.
            let promptIndex = 0;
            page.on('dialog', async dialog => {
              await dialog.accept(promptIndex++ === 0 ? '1200' : '800');
            });

            await page.locator('#devicePreset').selectOption('custom');
            await waitForDevice(
              'custom',
              'Custom Android viewport',
              'landscape'
            );

            const customFrame = await page.evaluate(() => {
              const frame = document.querySelector('#deviceFrame');
              const iframe = frame?.querySelector('.device-screen iframe');
              return {
                renderer: frame?.className,
                frameWidth: frame?.style.width,
                frameHeight: frame?.style.height,
                iframeWidth: iframe?.getAttribute('width'),
                iframeHeight: iframe?.getAttribute('height')
              };
            });

            if (!customFrame.renderer?.includes('device-frame--css') ||
                customFrame.iframeWidth !== '1200' ||
                customFrame.iframeHeight !== '800') {
              throw new Error(
                'Custom CSS frame was not rendered correctly: ' +
                JSON.stringify(customFrame)
              );
            }

            await page.reload({ waitUntil: 'domcontentloaded' });
            await waitForDevice(
              'custom',
              'Custom Android viewport',
              'landscape'
            );

            const customState = await page.evaluate(
              key => JSON.parse(localStorage.getItem(key)),
              STORAGE_KEY
            );

            if (customState?.customViewport?.width !== 1200 ||
                customState?.customViewport?.height !== 800) {
              throw new Error(
                'Custom viewport was not restored: ' +
                JSON.stringify(customState)
              );
            }

            // Invalid saved data must fall back to the default device.
            await page.evaluate(key => {
              localStorage.setItem(key, JSON.stringify({
                version: 1,
                deviceId: 'unknown-device',
                orientation: 'sideways'
              }));
            }, STORAGE_KEY);

            await page.reload({ waitUntil: 'domcontentloaded' });
            await waitForDevice(
              'google-pixel-10-pro',
              'Google Pixel 10 Pro',
              'portrait'
            );

            // The first-launch empty library uses its inline CTA only.
            const activity = page.frameLocator('#activityFrame');
            await page.locator('#parentScenario').selectOption('empty');
            await page.waitForFunction(() => {
              const document = window.document.querySelector('#activityFrame')?.contentDocument;
              const addButton = document?.querySelector('#addGameButton');
              const emptyLibrary = document?.querySelector('#emptyLibrary');
              return addButton?.hidden === true &&
                emptyLibrary?.style.display === 'block';
            }, null, { timeout: 15000 });

            if (await activity.locator('#addGameButton').isVisible()) {
              throw new Error('Add games must be hidden while the library is empty.');
            }
            if (!(await activity.locator('#emptyAddGameButton').isVisible()) ||
                !(await activity.locator('#emptyImportButton').isVisible())) {
              throw new Error('The first-launch Add your first game and Import profiles actions must remain visible.');
            }

            // Creating the first profile must reveal the section-level Add games action.
            await activity.locator('#emptyAddGameButton').click();
            await activity.locator('#appPickerList .app-picker-row').first().click();
            await activity.locator('#dialogInput').fill('Prototype UI regression profile');
            await activity.locator('#dialogConfirm').click();
            await activity.locator('#addGameButton').waitFor({
              state: 'visible',
              timeout: 10000
            });

            const addGameVisibility = {
              hiddenWhileEmpty: true,
              visibleAfterFirstProfile: await activity.locator('#addGameButton').isVisible()
            };
            if (!addGameVisibility.visibleAfterFirstProfile) {
              throw new Error('Add games did not become visible after creating the first profile.');
            }

            // Sample profiles let the test verify an actual two-way card interchange.
            await page.locator('#parentScenario').selectOption('samples');
            await page.waitForFunction(() => {
              const doc = document.querySelector('#activityFrame')?.contentDocument;
              return !!doc?.querySelector('#featuredSlot .game-profile-card[data-profile-id="sample-1"]') &&
                !!doc?.querySelector('#gameGrid .game-profile-card[data-profile-id="sample-2"]');
            }, null, { timeout: 15000 });

            const flipLibrary = page.frameLocator('#activityFrame');
            const sampleCatalog = await flipLibrary.locator('#featuredSlot').evaluate(slot => {
              const doc = slot.ownerDocument;
              const cards = [
                ...doc.querySelectorAll('#featuredSlot .game-profile-card, #gameGrid .game-profile-card')
              ];
              return {
                cardCount: cards.length,
                gridCount: doc.querySelectorAll('#gameGrid .game-profile-card').length,
                profiles: cards.map(card => ({
                  id: card.dataset.profileId,
                  name: card.querySelector('.game-profile-card__title')?.textContent?.trim(),
                  packageName: card.querySelector('.game-profile-card__package')?.textContent?.trim()
                }))
              };
            });
            const expectedSamplePackages = [
              ['Free Fire', 'com.dts.freefireth'],
              ['Mobile Legends: Bang Bang', 'com.mobile.legends'],
              ['League of Legends: Wild Rift', 'com.riotgames.league.wildrift'],
              ['Garena Delta Force', 'com.garena.game.df']
            ];
            for (const [name, packageName] of expectedSamplePackages) {
              if (!sampleCatalog.profiles.some(profile =>
                profile.name === name && profile.packageName === packageName
              )) {
                throw new Error(
                  'The sample library is missing a verified game or has the wrong package ID: ' +
                  JSON.stringify({ name, packageName, sampleCatalog })
                );
              }
            }
            if (sampleCatalog.cardCount !== 7 || sampleCatalog.gridCount !== 6) {
              throw new Error(
                'The sample library should show one selected game and six other games: ' +
                JSON.stringify(sampleCatalog)
              );
            }

            const flipRuntimeReady = await flipLibrary.locator('#featuredSlot').evaluate(slot => {
              const win = slot.ownerDocument.defaultView;
              return Boolean(win?.gsap && win?.Flip);
            });
            if (!flipRuntimeReady) {
              throw new Error('GSAP or the Flip plugin did not load in MainActivity.');
            }

            const longPackageName =
              'com.independentstudio.mobile.multiplayer.tacticalshooter.release2026';
            const measureLongPackage = async () => flipLibrary.locator(
              '#gameGrid [data-profile-id="sample-3"] .game-profile-card__package'
            ).evaluate((element, fullValue) => {
              element.textContent = fullValue;
              element.title = fullValue;
              const range = element.ownerDocument.createRange();
              range.selectNodeContents(element);
              const style = getComputedStyle(element);
              const card = element.closest('.game-profile-card');
              return {
                text: element.textContent,
                lineCount: range.getClientRects().length,
                whiteSpace: style.whiteSpace,
                overflowWrap: style.overflowWrap,
                clientWidth: element.clientWidth,
                scrollWidth: element.scrollWidth,
                clientHeight: element.clientHeight,
                scrollHeight: element.scrollHeight,
                cardWidth: card.clientWidth,
                cardScrollWidth: card.scrollWidth
              };
            }, longPackageName);

            const packageOverflowChecks = [];
            const assertPackageFits = (metrics, viewport) => {
              if (metrics.text !== longPackageName ||
                  metrics.lineCount < 2 ||
                  metrics.whiteSpace !== 'normal' ||
                  metrics.overflowWrap !== 'anywhere' ||
                  metrics.scrollWidth > metrics.clientWidth + 1 ||
                  metrics.scrollHeight > metrics.clientHeight + 1 ||
                  metrics.cardScrollWidth > metrics.cardWidth + 1) {
                throw new Error(
                  'The complete Android package ID must wrap without clipping at ' +
                  viewport + ': ' + JSON.stringify(metrics)
                );
              }
              packageOverflowChecks.push({ viewport, ...metrics });
            };

            // Pixel 10 Pro uses a narrow two-column library card.
            assertPackageFits(await measureLongPackage(), '410px Pixel viewport');

            // Galaxy S24 switches to the compact single-column card layout.
            await page.locator('#devicePreset').selectOption('samsung-s24');
            await waitForDevice('samsung-s24', 'Samsung Galaxy S24', 'portrait');
            assertPackageFits(await measureLongPackage(), '360px Galaxy S24 viewport');

            await page.locator('#devicePreset').selectOption('google-pixel-10-pro');
            await waitForDevice(
              'google-pixel-10-pro',
              'Google Pixel 10 Pro',
              'portrait'
            );

            await flipLibrary.locator('#featuredSlot').evaluate(slot => {
              const doc = slot.ownerDocument;
              const win = doc.defaultView;
              win.__xtmapperFlipRegression = {
                previousFeatured: doc.querySelector('#featuredSlot [data-profile-id="sample-1"]'),
                incomingFeatured: doc.querySelector('#gameGrid [data-profile-id="sample-2"]')
              };
            });

            await flipLibrary.locator(
              '#gameGrid [data-profile-id="sample-2"] .game-profile-card__select'
            ).click();

            // Observe the transition itself, not just the final DOM positions.
            await page.waitForFunction(() => {
              const doc = document.querySelector('#activityFrame')?.contentDocument;
              const win = doc?.defaultView;
              const refs = win?.__xtmapperFlipRegression;
              const incoming = doc?.querySelector('#featuredSlot [data-profile-id="sample-2"]');
              const previous = doc?.querySelector('#gameGrid [data-profile-id="sample-1"]');
              return !!refs &&
                incoming === refs.incomingFeatured &&
                previous === refs.previousFeatured &&
                win.gsap.isTweening(incoming) &&
                win.gsap.isTweening(previous);
            }, null, { timeout: 5000 });

            const profileSwapDuringMotion = await flipLibrary.locator('#featuredSlot').evaluate(slot => {
              const doc = slot.ownerDocument;
              const win = doc.defaultView;
              const incoming = doc.querySelector('#featuredSlot [data-profile-id="sample-2"]');
              const previous = doc.querySelector('#gameGrid [data-profile-id="sample-1"]');
              return {
                sameIncomingNode: incoming === win.__xtmapperFlipRegression.incomingFeatured,
                samePreviousNode: previous === win.__xtmapperFlipRegression.previousFeatured,
                incomingIsTweening: win.gsap.isTweening(incoming),
                previousIsTweening: win.gsap.isTweening(previous),
                featuredId: incoming?.dataset.profileId,
                gridId: previous?.dataset.profileId
              };
            });

            if (!profileSwapDuringMotion.sameIncomingNode ||
                !profileSwapDuringMotion.samePreviousNode ||
                !profileSwapDuringMotion.incomingIsTweening ||
                !profileSwapDuringMotion.previousIsTweening ||
                profileSwapDuringMotion.featuredId !== 'sample-2' ||
                profileSwapDuringMotion.gridId !== 'sample-1') {
              throw new Error(
                'Profile selection did not physically FLIP the same two card elements: ' +
                JSON.stringify(profileSwapDuringMotion)
              );
            }

            await page.waitForTimeout(1000);
            const profileSwapSettled = await flipLibrary.locator('#featuredSlot').evaluate(slot => {
              const doc = slot.ownerDocument;
              const win = doc.defaultView;
              const incoming = doc.querySelector('#featuredSlot [data-profile-id="sample-2"]');
              const previous = doc.querySelector('#gameGrid [data-profile-id="sample-1"]');
              return {
                sameIncomingNode: incoming === win.__xtmapperFlipRegression.incomingFeatured,
                samePreviousNode: previous === win.__xtmapperFlipRegression.previousFeatured,
                incomingIsTweening: win.gsap.isTweening(incoming),
                previousIsTweening: win.gsap.isTweening(previous),
                featuredId: incoming?.dataset.profileId,
                gridId: previous?.dataset.profileId
              };
            });

            if (!profileSwapSettled.sameIncomingNode ||
                !profileSwapSettled.samePreviousNode ||
                profileSwapSettled.incomingIsTweening ||
                profileSwapSettled.previousIsTweening ||
                profileSwapSettled.featuredId !== 'sample-2' ||
                profileSwapSettled.gridId !== 'sample-1') {
              throw new Error(
                'Profile FLIP did not settle into the expected card positions: ' +
                JSON.stringify(profileSwapSettled)
              );
            }

            // Interrupt one exchange with another selection while the first is moving.
            await flipLibrary.locator(
              '#gameGrid [data-profile-id="sample-3"] .game-profile-card__select'
            ).click();
            await page.waitForFunction(() => {
              const doc = document.querySelector('#activityFrame')?.contentDocument;
              const win = doc?.defaultView;
              const outgoing = doc?.querySelector('#gameGrid [data-profile-id="sample-2"]');
              const incoming = doc?.querySelector('#featuredSlot [data-profile-id="sample-3"]');
              return !!outgoing && !!incoming &&
                win.Flip.isFlipping(outgoing) &&
                win.Flip.isFlipping(incoming);
            }, null, { timeout: 5000 });

            await page.waitForTimeout(70);
            const rapidRetarget = await flipLibrary.locator(
              '#gameGrid [data-profile-id="sample-2"] .game-profile-card__select'
            ).evaluate(button => {
              const doc = button.ownerDocument;
              const win = doc.defaultView;
              const card = button.closest('.game-profile-card');
              const originalCard = card;
              const before = card.getBoundingClientRect();
              button.click();
              const after = card.getBoundingClientRect();
              const delta = {
                x: Math.abs(after.x - before.x),
                y: Math.abs(after.y - before.y),
                width: Math.abs(after.width - before.width),
                height: Math.abs(after.height - before.height)
              };
              return {
                sameNode: doc.querySelector('#featuredSlot [data-profile-id="sample-2"]') === originalCard,
                delta,
                maxDelta: Math.max(delta.x, delta.y, delta.width, delta.height),
                featuredId: doc.querySelector('#featuredSlot .game-profile-card')?.dataset.profileId,
                gridIds: [...doc.querySelectorAll('#gameGrid .game-profile-card')]
                  .map(element => element.dataset.profileId)
              };
            });

            // The synchronous geometry check above verifies there was no snap.
            // Wait for the next animation frame before checking that the new FLIP is active.
            if (!rapidRetarget.sameNode ||
                rapidRetarget.maxDelta > 3 ||
                rapidRetarget.featuredId !== 'sample-2' ||
                !rapidRetarget.gridIds.includes('sample-3')) {
              throw new Error(
                'Rapid profile selection snapped or failed to retarget from its current position: ' +
                JSON.stringify(rapidRetarget)
              );
            }

            await page.waitForFunction(() => {
              const doc = document.querySelector('#activityFrame')?.contentDocument;
              const win = doc?.defaultView;
              const sample2 = doc?.querySelector('#featuredSlot [data-profile-id="sample-2"]');
              const sample3 = doc?.querySelector('#gameGrid [data-profile-id="sample-3"]');
              return !!sample2 && !!sample3 &&
                (win.Flip.isFlipping(sample2) ||
                 win.Flip.isFlipping(sample3) ||
                 win.gsap.isTweening(sample2) ||
                 win.gsap.isTweening(sample3));
            }, null, { timeout: 3000 });

            await page.waitForFunction(() => {
              const doc = document.querySelector('#activityFrame')?.contentDocument;
              const win = doc?.defaultView;
              const sample2 = doc?.querySelector('#featuredSlot [data-profile-id="sample-2"]');
              const sample3 = doc?.querySelector('#gameGrid [data-profile-id="sample-3"]');
              return !!sample2 && !!sample3 &&
                !win.Flip.isFlipping(sample2) &&
                !win.Flip.isFlipping(sample3);
            }, null, { timeout: 5000 });

            // Reduced motion must keep the same final interchange without starting FLIP tweens.
            await page.emulateMedia({ reducedMotion: 'reduce' });
            await flipLibrary.locator(
              '#gameGrid [data-profile-id="sample-1"] .game-profile-card__select'
            ).click();
            await page.waitForFunction(() => {
              const doc = document.querySelector('#activityFrame')?.contentDocument;
              const win = doc?.defaultView;
              return !!doc?.querySelector('#featuredSlot [data-profile-id="sample-1"]') &&
                !!doc?.querySelector('#gameGrid [data-profile-id="sample-2"]') &&
                !win.gsap.isTweening(doc.querySelector('#featuredSlot [data-profile-id="sample-1"]')) &&
                !win.gsap.isTweening(doc.querySelector('#gameGrid [data-profile-id="sample-2"]'));
            }, null, { timeout: 5000 });

            // Clearing app data must restore the first-launch empty library without
            // resetting the independently persisted device-preview configuration.
            const previewStateBeforeAppReset = await page.evaluate(() =>
              localStorage.getItem('xtmapper.device-preview.state.v1')
            );

            page.removeAllListeners('dialog');
            const appDataResetDialogPromise = page.waitForEvent('dialog').then(async dialog => {
              if (dialog.type() !== 'confirm') {
                throw new Error('Clear app data must ask for confirmation.');
              }
              await dialog.accept();
              return dialog;
            });
            await page.locator('#clearPrototypeAppDataButton').click();
            await appDataResetDialogPromise;

            await page.waitForFunction(() => {
              const frame = document.querySelector('#activityFrame');
              const doc = frame?.contentDocument;
              const addButton = doc?.querySelector('#addGameButton');
              const emptyLibrary = doc?.querySelector('#emptyLibrary');
              const resetStatus = document.querySelector('#prototypeAppDataStatus')?.textContent || '';
              return doc?.readyState === 'complete' &&
                !!addButton && addButton.hidden === true &&
                !!emptyLibrary && getComputedStyle(emptyLibrary).display !== 'none' &&
                document.querySelector('#parentScenario')?.value === 'empty' &&
                resetStatus.includes('empty library') &&
                document.querySelector('#clearPrototypeAppDataButton')?.disabled === false;
            }, null, { timeout: 15000 });

            const appDataResetState = await page.evaluate(() => {
              const doc = document.querySelector('#activityFrame')?.contentDocument;
              const saved = JSON.parse(
                localStorage.getItem('xtmapper-main-prototype-v10') || 'null'
              );
              return {
                currentState: saved && {
                  scenario: saved.libraryScenario,
                  gamesCount: Array.isArray(saved.games) ? saved.games.length : null,
                  selectedId: saved.selectedId
                },
                remainingLegacyKeys: [
                  'xtmapper-main-prototype-v9',
                  'xtmapper-main-prototype-v8'
                ].filter(key => localStorage.getItem(key) !== null),
                previewState: localStorage.getItem('xtmapper.device-preview.state.v1'),
                selectedDevice: document.querySelector('#devicePreset')?.value,
                parentScenario: document.querySelector('#parentScenario')?.value,
                addGamesHidden: doc?.querySelector('#addGameButton')?.hidden,
                emptyLibraryVisible: !!doc?.querySelector('#emptyLibrary') &&
