            }

            async function verifyDialogCursorAt(pagePoint, pointName) {
              const localPoint = {
                x: (pagePoint.x - activityFrameGeometry.left) / activityFrameGeometry.scaleX,
                y: (pagePoint.y - activityFrameGeometry.top) / activityFrameGeometry.scaleY
              };
              await page.mouse.move(pagePoint.x, pagePoint.y);
              await page.waitForFunction(({ x, y }) => {
