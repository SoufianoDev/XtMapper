name: Prototype Preview State Verification

on:
  push:
    branches:
      - "ui/main-activity-premium-redesign"
      - "ui/gsap-device-preview-transitions"
    paths:
      - "prototypes/**"
      - ".github/workflows/verify-preview-state.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-preview-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify device selection and rotation persistence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start prototype server
        run: |
          python3 -m http.server 4173 --directory prototypes >/tmp/prototype-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/prototype-server.log
          exit 1

      - name: Verify device and orientation persistence
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { mkdirSync } from 'node:fs';

          const STORAGE_KEY = 'xtmapper.device-preview.state.v1';
          const visualEvidenceDir = '/tmp/xtmapper-preview-visual';
          mkdirSync(visualEvidenceDir, { recursive: true });
          const browser = await chromium.launch({
            headless: true,
            args: ['--no-sandbox']
          });
          const context = await browser.newContext({
            viewport: { width: 1440, height: 900 }
          });

          try {
            let page = await context.newPage();
            page.on('pageerror', error => {
              throw error;
            });

            await page.goto('http://127.0.0.1:4173/', {
              waitUntil: 'domcontentloaded'
            });

            const waitForGsap = async () => {
              await page.waitForFunction(
                () => window.gsap?.version === '3.15.0',
                null,
                { timeout: 30000 }
              );
            };

            await waitForGsap();

            const waitForSettledMotion = async () => {
              await page.waitForFunction(() => {
                const preview = document.querySelector('.preview');
                const frame = document.querySelector('#deviceFrame');
                return !!frame &&
                  !preview?.hasAttribute('aria-busy') &&
                  getComputedStyle(frame).opacity === '1' &&
                  !frame.style.transform;
              }, null, { timeout: 10000 });
            };

            const waitForRenderedFrame = async () => {
              await page.waitForFunction(() => {
                const frame = document.querySelector('#deviceFrame');
                if (!frame) return false;

                // Device mockups use a remote image asset.
                const image = frame.querySelector('.device-mockup__frame');
                const mockupReady = !!image && image.complete && image.naturalWidth > 0;

                // Custom viewports use the built-in CSS frame instead.
                const cssFrame = frame.classList.contains('device-frame--css')
                  ? frame.querySelector('.device-screen iframe')
                  : null;
                const cssFrameReady = !!cssFrame &&
                  Number(cssFrame.getAttribute('width')) > 0 &&
                  Number(cssFrame.getAttribute('height')) > 0 &&
                  Number.parseFloat(frame.style.width) > 0 &&
                  Number.parseFloat(frame.style.height) > 0;

                return mockupReady || cssFrameReady;
              }, null, { timeout: 60000 });
            };

            const waitForDevice = async (id, captionText, orientation) => {
              await page.waitForFunction(
                ({ id, captionText, orientation }) => {
                  const select = document.querySelector('#devicePreset');
                  const caption = document.querySelector('#previewCaption')?.textContent || '';
                  return select?.value === id &&
                    caption.includes(captionText) &&
                    caption.includes(orientation);
                },
                { id, captionText, orientation },
                { timeout: 60000 }
              );
              await waitForRenderedFrame();
            };

            await waitForDevice(
              'google-pixel-10-pro',
              'Google Pixel 10 Pro',
              'portrait'
            );

            await page.screenshot({ path: visualEvidenceDir + '/phone-portrait-start.png' });

            const initialState = await page.evaluate(key => ({
              selected: document.querySelector('#devicePreset').value,
              caption: document.querySelector('#previewCaption').textContent,
              saved: localStorage.getItem(key)
            }), STORAGE_KEY);

            if (initialState.selected !== 'google-pixel-10-pro' ||
                initialState.saved !== null) {
              throw new Error(
                'Fresh browser did not start with the default state: ' +
                JSON.stringify(initialState)
              );
            }

            const portraitLayout = await page.evaluate(() => {
              const stage = document.querySelector('.preview-stage').getBoundingClientRect();
              const toolbar = document.querySelector('.preview-toolbar').getBoundingClientRect();
              const device = document.querySelector('.device-rotation-shell').getBoundingClientRect();
              return {
                stage: { width: stage.width, height: stage.height, centerY: stage.top + stage.height / 2 },
                deviceCenter: { x: device.left + device.width / 2, y: device.top + device.height / 2 },
                toolbar: { left: toolbar.left, top: toolbar.top }
              };
            });

            // Pause the running GSAP timeline at its exact midpoint so the
            // screenshot is deterministic even on slower CI runners.
            await page.locator('#rotateDevice').click();
            await page.waitForFunction(() =>
              !!document.querySelector('#deviceFrame')?.__xtmapperRotationTimeline,
              null,
              { timeout: 10000 }
            );
            const rotationMotion = await page.evaluate(() => {
              const frame = document.querySelector('#deviceFrame');
              const timeline = frame.__xtmapperRotationTimeline;
              timeline.pause();
              timeline.time(0.45, false);

              return {
                rotation: window.gsap.getProperty(document.querySelector('.device-rotation-shell'), 'rotation'),
                contentRotation: window.gsap.getProperty(document.querySelector('.device-rotation-viewport'), 'rotation'),
                viewportWidth: window.gsap.getProperty(document.querySelector('.device-rotation-viewport'), 'width'),
                viewportHeight: window.gsap.getProperty(document.querySelector('.device-rotation-viewport'), 'height'),
                busy: document.querySelector('.preview').getAttribute('aria-busy'),
                opacity: Number(getComputedStyle(frame).opacity),
                deviceCenter: (() => {
                  const rect = document.querySelector('.device-rotation-shell').getBoundingClientRect();
                  return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                })(),
                portraitLayoutPreserved: document.querySelector('.preview').classList.contains('preview--portrait-phone'),
                landscapeLayoutAppliedEarly: document.querySelector('.showcase').classList.contains('showcase--landscape-preview'),
                stage: (() => {
                  const rect = document.querySelector('.preview-stage').getBoundingClientRect();
                  return { width: rect.width, height: rect.height, centerY: rect.top + rect.height / 2 };
                })(),
                toolbar: (() => {
                  const rect = document.querySelector('.preview-toolbar').getBoundingClientRect();
                  return { left: rect.left, top: rect.top };
                })()
              };
            });

            await page.screenshot({ path: visualEvidenceDir + '/phone-rotation-midpoint.png' });
            await page.evaluate(() => {
              document.querySelector('#deviceFrame')?.__xtmapperRotationTimeline?.play();
            });

            if (!(rotationMotion.rotation > 25 && rotationMotion.rotation < 65) ||
                Math.abs(rotationMotion.contentRotation) > 1 ||
                Math.abs(rotationMotion.viewportWidth - 410) > 1 ||
                Math.abs(rotationMotion.viewportHeight - 912) > 1 ||
                rotationMotion.busy !== 'true' ||
                rotationMotion.opacity !== 1 ||
                Math.abs(rotationMotion.deviceCenter.x - portraitLayout.deviceCenter.x) > 1 ||
                Math.abs(rotationMotion.deviceCenter.y - portraitLayout.deviceCenter.y) > 1 ||
                !rotationMotion.portraitLayoutPreserved ||
                rotationMotion.landscapeLayoutAppliedEarly ||
                Math.abs(rotationMotion.stage.width - portraitLayout.stage.width) > 1 ||
                Math.abs(rotationMotion.stage.height - portraitLayout.stage.height) > 1 ||
                Math.abs(rotationMotion.stage.centerY - portraitLayout.stage.centerY) > 1 ||
                Math.abs(rotationMotion.toolbar.left - portraitLayout.toolbar.left) > 1 ||
                Math.abs(rotationMotion.toolbar.top - portraitLayout.toolbar.top) > 1) {
              throw new Error(
                'The device did not enter the GSAP rotation transition: ' +
                JSON.stringify(rotationMotion)
              );
            }

            await waitForDevice(
              'google-pixel-10-pro',
              'Google Pixel 10 Pro',
              'landscape'
            );
            await waitForSettledMotion();
            await page.screenshot({ path: visualEvidenceDir + '/phone-landscape-end.png' });

            const completedRotation = await page.evaluate(() => ({
              shellRotation: window.gsap.getProperty(document.querySelector('.device-rotation-shell'), 'rotation'),
              screenRotation: window.gsap.getProperty(document.querySelector('.device-rotation-viewport'), 'rotation'),
              viewportWidth: Number(document.querySelector('.device-rotation-viewport').style.width.replace('px', '')),
              viewportHeight: Number(document.querySelector('.device-rotation-viewport').style.height.replace('px', ''))
            }));

            if (Math.abs(completedRotation.shellRotation - 90) > 0.1 ||
                Math.abs(completedRotation.screenRotation + 90) > 0.1 ||
                completedRotation.viewportWidth !== 912 ||
                completedRotation.viewportHeight !== 410) {
              throw new Error(
                'The completed device rotation did not settle into landscape: ' +
                JSON.stringify(completedRotation)
              );
            }


            // The reverse transition must mirror the forward transition:
            // keep the landscape screen orientation until the shell reaches
            // the halfway point, then reorient the viewport while the shell
            // finishes rotating back to portrait.
            await page.locator('#rotateDevice').click();
            await page.waitForFunction(() =>
              !!document.querySelector('#deviceFrame')?.__xtmapperRotationTimeline,
              null,
              { timeout: 10000 }
            );
            const reverseRotationMotion = await page.evaluate(() => {
              const frame = document.querySelector('#deviceFrame');
              const timeline = frame.__xtmapperRotationTimeline;
              timeline.pause();
              timeline.time(0.45, false);
              const shell = document.querySelector('.device-rotation-shell');
              const viewport = document.querySelector('.device-rotation-viewport');
              const shellRect = shell.getBoundingClientRect();

              return {
                shellRotation: window.gsap.getProperty(shell, 'rotation'),
                screenRotation: window.gsap.getProperty(viewport, 'rotation'),
                viewportWidth: window.gsap.getProperty(viewport, 'width'),
                viewportHeight: window.gsap.getProperty(viewport, 'height'),
                opacity: Number(getComputedStyle(frame).opacity),
                busy: document.querySelector('.preview').getAttribute('aria-busy'),
                deviceCenter: {
                  x: shellRect.left + shellRect.width / 2,
                  y: shellRect.top + shellRect.height / 2
                }
              };
            });

            await page.screenshot({
              path: visualEvidenceDir + '/phone-rotation-back-midpoint.png'
            });
            await page.evaluate(() => {
              document.querySelector('#deviceFrame')?.__xtmapperRotationTimeline?.play();
            });

            if (!(reverseRotationMotion.shellRotation > 25 &&
                  reverseRotationMotion.shellRotation < 65) ||
                Math.abs(reverseRotationMotion.screenRotation + 90) > 1 ||
                Math.abs(reverseRotationMotion.viewportWidth - 912) > 1 ||
                Math.abs(reverseRotationMotion.viewportHeight - 410) > 1 ||
                reverseRotationMotion.opacity !== 1 ||
                reverseRotationMotion.busy !== 'true' ||
                Math.abs(reverseRotationMotion.deviceCenter.x - portraitLayout.deviceCenter.x) > 1 ||
                Math.abs(reverseRotationMotion.deviceCenter.y - portraitLayout.deviceCenter.y) > 1) {
              throw new Error(
                'The reverse rotation did not preserve the symmetric midpoint: ' +
                JSON.stringify(reverseRotationMotion)
              );
            }

            await waitForDevice(
              'google-pixel-10-pro',
              'Google Pixel 10 Pro',
              'portrait'
            );
            await waitForSettledMotion();

            const completedReverseRotation = await page.evaluate(() => ({
              shellRotation: window.gsap.getProperty(document.querySelector('.device-rotation-shell'), 'rotation'),
              screenRotation: window.gsap.getProperty(document.querySelector('.device-rotation-viewport'), 'rotation'),
              viewportWidth: Number(document.querySelector('.device-rotation-viewport').style.width.replace('px', '')),
              viewportHeight: Number(document.querySelector('.device-rotation-viewport').style.height.replace('px', ''))
            }));

            if (Math.abs(completedReverseRotation.shellRotation) > 0.1 ||
                Math.abs(completedReverseRotation.screenRotation) > 0.1 ||
                completedReverseRotation.viewportWidth !== 410 ||
                completedReverseRotation.viewportHeight !== 912) {
              throw new Error(
                'The reverse rotation did not settle into portrait: ' +
                JSON.stringify(completedReverseRotation)
              );
            }

            // Device switching must fade out, replace the frame, then fade in.
            await page.locator('#devicePreset').selectOption('samsung-s24');
            await page.waitForTimeout(70);
            const switchMotion = await page.evaluate(() => ({
              opacity: Number(getComputedStyle(document.querySelector('#deviceFrame')).opacity),
              busy: document.querySelector('.preview').getAttribute('aria-busy')
            }));

            if (!(switchMotion.opacity < 1) || switchMotion.busy !== 'true') {
              throw new Error(
                'The device switch did not enter its fade transition: ' +
                JSON.stringify(switchMotion)
              );
            }

            await waitForDevice('samsung-s24', 'Samsung Galaxy S24', 'landscape');
            await waitForSettledMotion();

            const switchedWhileLandscape = await page.evaluate(key => ({
              selected: document.querySelector('#devicePreset').value,
              caption: document.querySelector('#previewCaption').textContent,
              state: JSON.parse(localStorage.getItem(key))
            }), STORAGE_KEY);

            if (switchedWhileLandscape.state?.deviceId !== 'samsung-s24' ||
                switchedWhileLandscape.state?.orientation !== 'landscape') {
              throw new Error(
                'Changing device did not preserve landscape: ' +
                JSON.stringify(switchedWhileLandscape)
              );
            }

            if (!switchedWhileLandscape.caption.includes('780 × 360 CSS px')) {
              throw new Error(
                'The selected phone did not use landscape viewport dimensions: ' +
                JSON.stringify(switchedWhileLandscape)
              );
            }

            // A reload and a newly opened page must restore the same state.
            await page.reload({ waitUntil: 'domcontentloaded' });
            await waitForDevice('samsung-s24', 'Samsung Galaxy S24', 'landscape');

            await page.close();
            page = await context.newPage();
            page.on('pageerror', error => {
              throw error;
            });
            await page.goto('http://127.0.0.1:4173/', {
              waitUntil: 'domcontentloaded'
            });
            await waitForGsap();
            await waitForDevice('samsung-s24', 'Samsung Galaxy S24', 'landscape');

            // Switching in portrait must also preserve portrait.
            await page.locator('#rotateDevice').click();
            await waitForDevice('samsung-s24', 'Samsung Galaxy S24', 'portrait');
            await waitForSettledMotion();

            await page.locator('#devicePreset').selectOption('galaxy-tab-s7');
            await waitForDevice(
              'galaxy-tab-s7',
              'Samsung Galaxy Tab S7',
              'portrait'
            );
            await waitForSettledMotion();

            const switchedWhilePortrait = await page.evaluate(
              key => JSON.parse(localStorage.getItem(key)),
              STORAGE_KEY
            );

            if (switchedWhilePortrait?.deviceId !== 'galaxy-tab-s7' ||
                switchedWhilePortrait?.orientation !== 'portrait') {
              throw new Error(
                'Changing device did not preserve portrait: ' +
                JSON.stringify(switchedWhilePortrait)
              );
            }

            // Tablet selection and rotation must survive a reload.
            await page.locator('#rotateDevice').click();
            await waitForDevice(
              'galaxy-tab-s7',
              'Samsung Galaxy Tab S7',
              'landscape'
            );
            await waitForSettledMotion();
            await page.reload({ waitUntil: 'domcontentloaded' });
            await waitForDevice(
              'galaxy-tab-s7',
              'Samsung Galaxy Tab S7',
              'landscape'
            );

            // Custom viewport uses CSS, not a remote mockup image.
            let promptIndex = 0;
            page.on('dialog', async dialog => {
              await dialog.accept(promptIndex++ === 0 ? '1200' : '800');
            });

            await page.locator('#devicePreset').selectOption('custom');
            await waitForDevice(
              'custom',
              'Custom Android viewport',
              'landscape'
            );
            await waitForSettledMotion();
            await page.screenshot({ path: visualEvidenceDir + '/custom-landscape-end.png' });

            const customFrame = await page.evaluate(() => {
              const frame = document.querySelector('#deviceFrame');
              const iframe = frame?.querySelector('.device-screen iframe');
              return {
                renderer: frame?.className,
                frameWidth: frame?.style.width,
                frameHeight: frame?.style.height,
                iframeWidth: iframe?.getAttribute('width'),
                iframeHeight: iframe?.getAttribute('height')
              };
            });

            if (!customFrame.renderer?.includes('device-frame--css') ||
                customFrame.iframeWidth !== '1200' ||
                customFrame.iframeHeight !== '800') {
              throw new Error(
                'Custom CSS frame was not rendered correctly: ' +
                JSON.stringify(customFrame)
              );
            }

            // Rotate the built-in CSS frame both ways; it has no mockup image.
            await page.locator('#rotateDevice').click();
            await waitForDevice(
              'custom',
              'Custom Android viewport',
              'portrait'
            );
            await waitForSettledMotion();

            const customPortraitViewport = await page.evaluate(() => {
              const iframe = document.querySelector('#deviceFrame .device-screen iframe');
              return {
                width: iframe?.getAttribute('width'),
                height: iframe?.getAttribute('height')
              };
            });

            if (customPortraitViewport.width !== '800' ||
                customPortraitViewport.height !== '1200') {
              throw new Error(
                'Custom CSS frame did not rotate to portrait: ' +
                JSON.stringify(customPortraitViewport)
              );
            }

            await page.locator('#rotateDevice').click();
            await waitForDevice(
              'custom',
              'Custom Android viewport',
              'landscape'
            );
            await waitForSettledMotion();

            await page.reload({ waitUntil: 'domcontentloaded' });
            await waitForDevice(
              'custom',
              'Custom Android viewport',
              'landscape'
            );
            await waitForSettledMotion();

            const customState = await page.evaluate(
              key => JSON.parse(localStorage.getItem(key)),
              STORAGE_KEY
            );

            if (customState?.customViewport?.width !== 1200 ||
                customState?.customViewport?.height !== 800) {
              throw new Error(
                'Custom viewport was not restored: ' +
                JSON.stringify(customState)
              );
            }

            // Invalid saved data must fall back to the default device.
            await page.evaluate(key => {
              localStorage.setItem(key, JSON.stringify({
                version: 1,
                deviceId: 'unknown-device',
                orientation: 'sideways'
              }));
            }, STORAGE_KEY);

            await page.reload({ waitUntil: 'domcontentloaded' });
            await waitForDevice(
              'google-pixel-10-pro',
              'Google Pixel 10 Pro',
              'portrait'
            );

            // Reduced motion must keep state changes instant and skip large rotation.
            const reducedPage = await context.newPage();
            page = reducedPage;
            page.on('pageerror', error => {
              throw error;
            });
            await page.emulateMedia({ reducedMotion: 'reduce' });
            await page.goto('http://127.0.0.1:4173/', {
              waitUntil: 'domcontentloaded'
            });
            await waitForGsap();
            await waitForDevice(
              'google-pixel-10-pro',
              'Google Pixel 10 Pro',
              'portrait'
            );

            await page.locator('#rotateDevice').click();
            await waitForDevice(
              'google-pixel-10-pro',
              'Google Pixel 10 Pro',
              'landscape'
            );

            const reducedRotation = await page.evaluate(() => ({
              rotation: window.gsap.getProperty(document.querySelector('.device-rotation-shell'), 'rotation'),
              contentRotation: window.gsap.getProperty(document.querySelector('.device-rotation-viewport'), 'rotation'),
              opacity: Number(getComputedStyle(document.querySelector('#deviceFrame')).opacity),
              busy: document.querySelector('.preview').getAttribute('aria-busy'),
              inlineTransform: document.querySelector('#deviceFrame').style.transform
            }));

            if (Math.abs(reducedRotation.rotation - 90) > 0.1 ||
                Math.abs(reducedRotation.contentRotation + 90) > 0.1 ||
                reducedRotation.opacity !== 1 ||
                reducedRotation.busy !== null ||
                reducedRotation.inlineTransform !== '') {
              throw new Error(
                'Reduced-motion preference did not skip large rotation: ' +
                JSON.stringify(reducedRotation)
              );
            }

            await page.locator('#devicePreset').selectOption('samsung-s24');
            await waitForDevice('samsung-s24', 'Samsung Galaxy S24', 'landscape');

            const reducedSwitch = await page.evaluate(() => ({
              opacity: Number(getComputedStyle(document.querySelector('#deviceFrame')).opacity),
              busy: document.querySelector('.preview').getAttribute('aria-busy')
            }));

            if (reducedSwitch.opacity !== 1 || reducedSwitch.busy !== null) {
              throw new Error(
                'Reduced-motion device switching did not complete instantly: ' +
                JSON.stringify(reducedSwitch)
              );
            }

            console.log('DEVICE_PREVIEW_GSAP_MOTION_AND_STATE_PASSED');
            console.log(JSON.stringify({
              initialState,
              switchedWhileLandscape,
              switchedWhilePortrait,
              customFrame,
              customState,
              invalidStateFallback: 'Google Pixel 10 Pro · portrait'
            }, null, 2));
          } finally {
            await context.close();
            await browser.close();
          }
          NODE

      - name: Upload device rotation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-rotation-visual-evidence
          path: /tmp/xtmapper-preview-visual/
          if-no-files-found: ignore
          retention-days: 7
