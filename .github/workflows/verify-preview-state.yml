            }

            const target = frame.locator('#touch-preview-regression-target');
            const tapTargetBox = await target.boundingBox();
            if (!tapTargetBox) {
              throw new Error('The touch regression target is not visible for a tap.');
            }

            const tapReadiness = await target.evaluate(button => {
              const rect = button.getBoundingClientRect();
              const hit = button.ownerDocument.elementFromPoint(
