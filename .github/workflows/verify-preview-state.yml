                win?.__xtmapperScrollTriggerReady === true;
            }, null, { timeout: 20000 });

            const frame = page.frameLocator('#activityFrame');
            const workspaceScrollbar = await page.locator('.panel-content').evaluate(element => ({
              width: getComputedStyle(element).scrollbarWidth,
              webkitDisplay: getComputedStyle(element, '::-webkit-scrollbar').display
            }));
            if (workspaceScrollbar.width !== 'none' ||
                workspaceScrollbar.webkitDisplay !== 'none') {
              throw new Error(
                'Workspace scrollbars must be hidden without disabling scrolling: ' +
                JSON.stringify(workspaceScrollbar)
              );
            }

            const activityScrollbars = await frame.locator('#app.phone > main').evaluate(element => ({
              width: getComputedStyle(element).scrollbarWidth,
