              const document = window.document.querySelector('#activityFrame')?.contentDocument;
              const dialog = document?.querySelector('#dialog');
              const layer = document?.querySelector('.touch-preview-cursor-layer');
              return dialog?.open &&
                dialog.querySelector('#dialogTitle')?.textContent === 'Change assigned app' &&
                layer?.parentElement === dialog &&
                layer.matches(':popover-open');
            }, null, { timeout: 5000 });

            const changeSearch = frame.locator('#appSearch');
            await changeSearch.focus();
            const changeSearchBox = await changeSearch.boundingBox();
            if (!changeSearchBox) throw new Error('Change assigned app search is not visible.');
            await verifyDialogCursorAt(centerOf(changeSearchBox), 'Change assigned app search');
            await verifyDialogCursorLayerTopmost(centerOf(changeSearchBox), 'Change assigned app search');
            await frame.locator('#appPickerList .app-picker-row').nth(1).click();
            await page.waitForFunction(() => {
              const document = window.document.querySelector('#activityFrame')?.contentDocument;
              const layer = document?.querySelector('.touch-preview-cursor-layer');
              return !document?.querySelector('#dialog')?.open &&
                layer?.parentElement === document?.querySelector('#app') &&
                !layer.hasAttribute('popover');
            }, null, { timeout: 5000 });

            // Verify the remaining profile-action dialog branches use the same cursor layer.
            await profileMenu.click();
            await frame.locator('[data-profile-action="edit"]').click();
            await page.waitForFunction(() => {
              const document = window.document.querySelector('#activityFrame')?.contentDocument;
              const dialog = document?.querySelector('#dialog');
              const layer = document?.querySelector('.touch-preview-cursor-layer');
              return dialog?.open &&
                dialog.querySelector('#dialogTitle')?.textContent === 'Keymap editor' &&
                layer?.parentElement === dialog &&
                layer.matches(':popover-open');
            }, null, { timeout: 5000 });
            const editorButtonBox = await frame.locator('#dialogConfirm').boundingBox();
            if (!editorButtonBox) throw new Error('Keymap editor dialog action is not visible.');
            await verifyDialogCursorAt(centerOf(editorButtonBox), 'Keymap editor dialog');
            await verifyDialogCursorLayerTopmost(centerOf(editorButtonBox), 'Keymap editor dialog');
            await frame.locator('#dialogCancel').click();

            await profileMenu.click();
            await frame.locator('[data-profile-action="delete"]').click();
            await page.waitForFunction(() => {
              const document = window.document.querySelector('#activityFrame')?.contentDocument;
              const dialog = document?.querySelector('#dialog');
              const layer = document?.querySelector('.touch-preview-cursor-layer');
              return dialog?.open &&
                dialog.querySelector('#dialogTitle')?.textContent === 'Delete profile?' &&
                layer?.parentElement === dialog &&
                layer.matches(':popover-open');
            }, null, { timeout: 5000 });
            const deleteButtonBox = await frame.locator('#dialogConfirm').boundingBox();
            if (!deleteButtonBox) throw new Error('Delete profile dialog action is not visible.');
            await verifyDialogCursorAt(centerOf(deleteButtonBox), 'Delete profile dialog');
            await verifyDialogCursorLayerTopmost(centerOf(deleteButtonBox), 'Delete profile dialog');
            await frame.locator('#dialogCancel').click();

            await page.waitForFunction(() => {
              const document = window.document.querySelector('#activityFrame')?.contentDocument;
              const layer = document?.querySelector('.touch-preview-cursor-layer');
              return !document?.querySelector('#dialog')?.open &&
                layer?.parentElement === document?.querySelector('#app') &&
                !layer.hasAttribute('popover');
            }, null, { timeout: 5000 });

            console.log('CREATE_PROFILE_DIALOG_CURSOR_PASSED');
            console.log('DIALOG_INPUT_FOCUS_RING_CONSISTENT_PASSED');
            console.log('PROFILE_ACTION_DIALOG_TRANSITIONS_PASSED');

                        const targetBox = await target.boundingBox();
            if (!targetBox) throw new Error('The touch regression target is not visible.');

            await page.mouse.move(
              targetBox.x + targetBox.width / 2,
              targetBox.y + targetBox.height / 2
            );
            await page.waitForFunction(() => {
              const document = window.document.querySelector('#activityFrame')?.contentDocument;
              const app = document?.querySelector('#app');
              const layer = document?.querySelector('.touch-preview-cursor-layer');
              const cursor = document?.querySelector('.touch-preview-cursor');
              const style = getComputedStyle(cursor);
              return document?.documentElement.classList.contains('touch-preview-pointer') &&
                layer?.parentElement === app &&
                !layer.hasAttribute('popover') &&
                !layer.matches(':popover-open') &&
                cursor?.parentElement === layer &&
                !cursor.hidden &&
                style.display !== 'none' &&
                style.visibility === 'visible' &&
                Number.parseFloat(style.opacity) > 0;
            }, null, { timeout: 5000 });

            await page.mouse.down();
            await page.mouse.move(
              targetBox.x + targetBox.width / 2,
              targetBox.y + targetBox.height / 2 - 110,
              { steps: 8 }
            );
            await page.mouse.up();

            await page.waitForFunction(() => {
              const main = document.querySelector('#activityFrame')?.contentDocument
                ?.querySelector('#app.phone > main');
              return main && main.scrollTop > 8;
            }, null, { timeout: 5000 });

            const dragResult = await target.evaluate(button => ({
              clickCount: Number(button.dataset.clickCount),
              mainScrollTop: button.closest('main').scrollTop
            }));
            if (dragResult.clickCount !== 1 || dragResult.mainScrollTop <= 8) {
              throw new Error(
                'A swipe must scroll the Activity without generating a click: ' +
                JSON.stringify(dragResult)
              );
            }

            await frame.locator('#app.phone > main').evaluate(main => {
              main.scrollTop = 0;
            });
            const freshTargetBox = await target.boundingBox();
            const iframeBox = await page.locator('#activityFrame').boundingBox();
            if (!freshTargetBox || !iframeBox) throw new Error('Device preview geometry is unavailable.');

            await page.mouse.move(
              freshTargetBox.x + freshTargetBox.width / 2,
              freshTargetBox.y + freshTargetBox.height / 2
            );
            await page.mouse.down();
            await page.waitForFunction(() => {
              const win = document.querySelector('#activityFrame')?.contentWindow;
              return win?.__xtmapperTouchPreview?.state === 'pressed';
            }, null, { timeout: 5000 });

            await page.mouse.move(
              iframeBox.x + iframeBox.width + 45,
              iframeBox.y + 120,
              { steps: 5 }
            );

            const cursorHiddenOnExit = await frame.locator('#app').evaluate(app =>
              app.querySelector('.touch-preview-cursor')?.hidden === true
            );
            if (!cursorHiddenOnExit) {
              throw new Error('The touch cursor must disappear immediately after leaving the device screen.');
            }

            await page.mouse.move(
              freshTargetBox.x + freshTargetBox.width / 2,
              freshTargetBox.y + freshTargetBox.height / 2
            );
            const stateWhileReentered = await frame.locator('#app').evaluate(() =>
              window.__xtmapperTouchPreview.state
            );
            await page.mouse.up();

            const exitResult = await frame.locator('#app').evaluate(app => ({
              state: window.__xtmapperTouchPreview.state,
              pressedClassRemoved: !app.ownerDocument.documentElement.classList.contains('touch-preview-pressed'),
              clickCount: Number(app.querySelector('#touch-preview-regression-target')?.dataset.clickCount)
            }));
            if (stateWhileReentered !== 'idle' ||
                exitResult.state !== 'idle' ||
                !exitResult.pressedClassRemoved ||
                exitResult.clickCount !== 1) {
              throw new Error(
                'Leaving the device screen must cancel the gesture and must not resume on re-entry: ' +
                JSON.stringify({ cursorHiddenOnExit, stateWhileReentered, exitResult })
              );
            }

            const triggerState = await frame.locator('#app.phone > main').evaluate(main => ({
              pluginRegistered: typeof window.ScrollTrigger?.refresh === 'function',
              triggerCount: window.ScrollTrigger?.getAll().length || 0,
              usesMainScroller: (window.ScrollTrigger?.getAll() || [])
                .some(trigger => trigger.scroller === main)
            }));
            if (!triggerState.pluginRegistered ||
                triggerState.triggerCount < 1 ||
                !triggerState.usesMainScroller) {
              throw new Error(
                'ScrollTrigger must be registered and use the Activity main scroller: ' +
                JSON.stringify(triggerState)
              );
            }

            if (pageErrors.length) {
              throw new Error('Browser page errors: ' + pageErrors.join(' | '));
            }

            console.log('WORKSPACE_SCROLLBARS_HIDDEN_PASSED');
            console.log('ACTIVITY_SCROLLBAR_EXCEPTION_PASSED');
            console.log('NESTED_ACTIVITY_SCROLLBARS_HIDDEN_PASSED');
            console.log('TOUCH_TAP_AND_SWIPE_PASSED');
            console.log('TOUCH_SCREEN_EXIT_CANCELLATION_PASSED');
            console.log('SCROLLTRIGGER_SCROLLER_CONFIGURATION_PASSED');
            console.log(JSON.stringify({
              workspaceScrollbar,
              activityScrollbars,
              hiddenActivityScrollbar,
              dragResult,
              exitResult,
              triggerState
            }, null, 2));
          } finally {
            await page.close();
            await browser.close();
          }
