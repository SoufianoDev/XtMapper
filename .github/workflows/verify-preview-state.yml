              const app = document?.querySelector('#app');
              const layer = document?.querySelector('.touch-preview-cursor-layer');
              const cursor = document?.querySelector('.touch-preview-cursor');
              const target = document?.querySelector('#touch-preview-regression-target');
              if (!app || !layer || !cursor || !target ||
