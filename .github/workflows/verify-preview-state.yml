            }

            const touchTarget = await frame.locator('#app.phone > main').evaluate(main => {
              const button = document.createElement('button');
              button.id = 'touch-preview-regression-target';
              button.type = 'button';
              button.textContent = 'Touch preview regression target';
              button.style.cssText = 'display:block;width:100%;min-height:48px;margin:12px 0;padding:8px;';
              button.dataset.clickCount = '0';
              button.addEventListener('click', () => {
                button.dataset.clickCount = String(Number(button.dataset.clickCount) + 1);
              });
              main.prepend(button);

              const filler = document.createElement('div');
              filler.id = 'touch-preview-regression-filler';
