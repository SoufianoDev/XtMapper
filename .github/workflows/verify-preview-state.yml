name: Temporary device preview state persistence check

on:
  push:
    branches:
      - "ui/main-activity-premium-redesign"
    paths:
      - ".github/workflows/verify-preview-state.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start prototype server
        run: |
          python3 -m http.server 4173 --directory prototypes >/tmp/prototype-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/prototype-server.log
          exit 1
      - name: Verify device and orientation persistence
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const STORAGE_KEY = 'xtmapper.device-preview.state.v1';
          const browser = await chromium.launch({ headless: true, args: ['--no-sandbox'] });
          const context = await browser.newContext({ viewport: { width: 1440, height: 900 } });

          try {
            let page = await context.newPage();
            page.on('pageerror', error => { throw error; });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });

            const waitForDevice = async (id, captionText, orientation) => {
              await page.waitForFunction(
                ({ id, captionText, orientation }) => {
                  const select = document.querySelector('#devicePreset');
                  const caption = document.querySelector('#previewCaption')?.textContent || '';
                  return select?.value === id &&
                    caption.includes(captionText) &&
                    caption.includes(orientation);
                },
                { id, captionText, orientation },
                { timeout: 60000 }
              );
              if (id === 'custom') {
                await page.waitForFunction(() => {
                  const frame = document.querySelector('#deviceFrame');
                  return !!frame?.style.width && !!frame?.style.height;
                }, null, { timeout: 60000 });
              } else {
                await page.waitForFunction(() => {
                  const image = document.querySelector('.device-mockup__frame');
                  return image?.complete && image.naturalWidth > 0;
                }, null, { timeout: 60000 });
              }
            };

            await waitForDevice('google-pixel-10-pro', 'Google Pixel 10 Pro', 'portrait');
            const initialState = await page.evaluate(key => ({
              selected:document.querySelector('#devicePreset').value,
              caption:document.querySelector('#previewCaption').textContent,
              saved:localStorage.getItem(key)
            }), STORAGE_KEY);
            if (initialState.selected !== 'google-pixel-10-pro' || initialState.saved !== null) {
              throw new Error('Fresh browser did not start with default state: ' + JSON.stringify(initialState));
            }

            await page.locator('#rotateDevice').click();
            await waitForDevice('google-pixel-10-pro', 'Google Pixel 10 Pro', 'landscape');

            await page.locator('#devicePreset').selectOption('samsung-s24');
            await waitForDevice('samsung-s24', 'Samsung Galaxy S24', 'landscape');
            const switchedWhileLandscape = await page.evaluate(key => ({
              selected:document.querySelector('#devicePreset').value,
              caption:document.querySelector('#previewCaption').textContent,
              state:JSON.parse(localStorage.getItem(key))
            }), STORAGE_KEY);
            if (switchedWhileLandscape.state?.deviceId !== 'samsung-s24' ||
                switchedWhileLandscape.state?.orientation !== 'landscape') {
              throw new Error('Changing device did not preserve landscape state: ' + JSON.stringify(switchedWhileLandscape));
            }
            if (!switchedWhileLandscape.caption.includes('780 × 360 CSS px')) {
              throw new Error('Selected phone did not use landscape viewport dimensions: ' + JSON.stringify(switchedWhileLandscape));
            }

            await page.reload({ waitUntil: 'domcontentloaded' });
            await waitForDevice('samsung-s24', 'Samsung Galaxy S24', 'landscape');

            await page.close();
            page = await context.newPage();
            page.on('pageerror', error => { throw error; });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
            await waitForDevice('samsung-s24', 'Samsung Galaxy S24', 'landscape');

            await page.locator('#rotateDevice').click();
            await waitForDevice('samsung-s24', 'Samsung Galaxy S24', 'portrait');
            await page.locator('#devicePreset').selectOption('galaxy-tab-s7');
            await waitForDevice('galaxy-tab-s7', 'Samsung Galaxy Tab S7', 'portrait');
            const switchedWhilePortrait = await page.evaluate(key => JSON.parse(localStorage.getItem(key)), STORAGE_KEY);
            if (switchedWhilePortrait?.deviceId !== 'galaxy-tab-s7' ||
                switchedWhilePortrait?.orientation !== 'portrait') {
              throw new Error('Changing device did not preserve portrait state: ' + JSON.stringify(switchedWhilePortrait));
            }

            await page.locator('#rotateDevice').click();
            await waitForDevice('galaxy-tab-s7', 'Samsung Galaxy Tab S7', 'landscape');
            await page.reload({ waitUntil: 'domcontentloaded' });
            await waitForDevice('galaxy-tab-s7', 'Samsung Galaxy Tab S7', 'landscape');

            let promptIndex = 0;
            page.on('dialog', async dialog => {
              await dialog.accept(promptIndex++ === 0 ? '1200' : '800');
            });
            await page.locator('#devicePreset').selectOption('custom');
            await waitForDevice('custom', 'Custom Android viewport', 'landscape');
            await page.reload({ waitUntil: 'domcontentloaded' });
            await waitForDevice('custom', 'Custom Android viewport', 'landscape');
            const customState = await page.evaluate(key => JSON.parse(localStorage.getItem(key)), STORAGE_KEY);
            if (customState?.customViewport?.width !== 1200 ||
                customState?.customViewport?.height !== 800) {
              throw new Error('Custom viewport was not restored: ' + JSON.stringify(customState));
            }

            await page.evaluate(key => {
              localStorage.setItem(key, JSON.stringify({
                version:1,
                deviceId:'unknown-device',
                orientation:'sideways'
              }));
            }, STORAGE_KEY);
            await page.reload({ waitUntil: 'domcontentloaded' });
            await waitForDevice('google-pixel-10-pro', 'Google Pixel 10 Pro', 'portrait');

            console.log('DEVICE_PREVIEW_STATE_PERSISTENCE_PASSED');
            console.log(JSON.stringify({
              initialState,
              switchedWhileLandscape,
              switchedWhilePortrait,
              customState,
              invalidStateFallback:'Google Pixel 10 Pro · portrait'
            }, null, 2));
          } finally {
            await context.close();
            await browser.close();
          }
          NODE
